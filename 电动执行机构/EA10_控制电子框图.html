<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EA10 控制电子框图</title>
<style>
  :root { --bg:#0b1220; --fg:#e8eef7; --muted:#94a3b8; --accent:#4fc3f7; --hot:#ff8a65; --ok:#81c784; --spi:#ce93d8; }
  body { margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#0b1220; color:var(--fg); }
  header { padding:18px 24px; border-bottom:1px solid #1f2937; }
  header h1 { margin:0 0 6px; font-size:20px; }
  header p { margin:0; color:var(--muted); font-size:13px; max-width:900px; }
  .wrap { padding:16px; max-width:1100px; margin:0 auto; }
  svg { width:100%; height:auto; background:#0a101a; border-radius:12px; border:1px solid #243044; }
  .note { margin-top:12px; font-size:12px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>EA10 控制电子 · 分舱与信号</h1>
  <p>橙：380 V 只在端子舱和接触器主触点。紫：传感 SPI 从干腔进控制仓，不经过端子舱。蓝：双密封隔板。</p>
</header>
<div class="wrap">
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="40" width="280" height="480" rx="10" fill="#1a1520" stroke="#ff8a65" stroke-width="2"/>
  <text x="40" y="68" fill="#ff8a65" font-size="16">端子舱（可进水）</text>
  <text x="40" y="100" fill="#e8eef7" font-size="13">L1 L2 L3  熔断 6A</text>
  <text x="40" y="122" fill="#e8eef7" font-size="13">远方 OPEN / CLOSE / STOP</text>
  <text x="40" y="144" fill="#e8eef7" font-size="13">触点 OPENED CLOSED RUN FAULT</text>
  <text x="40" y="176" fill="#94a3b8" font-size="12">格兰可漏 · 水停本舱</text>
  <rect x="50" y="210" width="220" height="70" rx="6" fill="#2a1a14" stroke="#ff8a65"/>
  <text x="70" y="250" fill="#ffb74d" font-size="13">380 V 端子 1–6</text>
  <rect x="50" y="300" width="220" height="70" rx="6" fill="#152033" stroke="#4fc3f7"/>
  <text x="70" y="340" fill="#4fc3f7" font-size="13">24 V 远方端子 11–28</text>
  <rect x="50" y="400" width="220" height="80" rx="6" fill="#1a2030" stroke="#81c784"/>
  <text x="70" y="435" fill="#81c784" font-size="13">穿墙：4 芯动力</text>
  <text x="70" y="455" fill="#81c784" font-size="13">穿墙：24 芯信号</text>

  <rect x="300" y="40" width="18" height="480" fill="#4fc3f7"/>
  <text x="309" y="280" fill="#0b1220" font-size="12" transform="rotate(-90 309 280)">双密封隔板</text>

  <rect x="330" y="40" width="640" height="480" rx="10" fill="#111827" stroke="#4fc3f7" stroke-width="2"/>
  <text x="350" y="68" fill="#4fc3f7" font-size="16">控制仓（必须干燥）</text>

  <rect x="360" y="90" width="180" height="90" rx="8" fill="#16324a" stroke="#4fc3f7"/>
  <text x="390" y="125" fill="#e8eef7" font-size="14">HDR-60-24</text>
  <text x="400" y="148" fill="#94a3b8" font-size="12">24 V / 2.5 A</text>

  <rect x="560" y="90" width="180" height="90" rx="8" fill="#3b1d4a" stroke="#ce93d8"/>
  <text x="585" y="125" fill="#ce93d8" font-size="14">STM32G474</text>
  <text x="590" y="148" fill="#94a3b8" font-size="12">SPI1/2/3  LCD</text>

  <rect x="760" y="90" width="180" height="90" rx="8" fill="#1a2740" stroke="#ffb74d"/>
  <text x="790" y="125" fill="#ffb74d" font-size="14">K_open / K_close</text>
  <text x="800" y="148" fill="#94a3b8" font-size="12">CJX2-09 互锁</text>

  <rect x="360" y="210" width="280" height="100" rx="8" fill="#2a2040" stroke="#ce93d8"/>
  <text x="380" y="240" fill="#ce93d8" font-size="14">SPI ← 干腔（不经端子舱）</text>
  <text x="380" y="268" fill="#e8eef7" font-size="13">SPI1 AS5047P   SPI2 ADS1220</text>
  <text x="380" y="290" fill="#e8eef7" font-size="13">SPI3/UART 韦根多圈</text>

  <rect x="660" y="210" width="280" height="100" rx="8" fill="#152238" stroke="#81c784"/>
  <text x="680" y="240" fill="#81c784" font-size="14">就地磁旋钮 · 手轮微动</text>
  <text x="680" y="268" fill="#e8eef7" font-size="13">开/停/关   就地/停/远方</text>
  <text x="680" y="290" fill="#e8eef7" font-size="13">手轮 NC 切断接触器</text>

  <rect x="360" y="340" width="280" height="80" rx="8" fill="#1a2030" stroke="#ff8a65"/>
  <text x="380" y="372" fill="#ff8a65" font-size="13">相序光耦 L1 L2 L3 → MCU</text>
  <text x="380" y="396" fill="#94a3b8" font-size="12">固件对调开/关接触器</text>

  <rect x="660" y="340" width="280" height="80" rx="8" fill="#1a2030" stroke="#81c784"/>
  <text x="680" y="372" fill="#81c784" font-size="13">加热 10 W · LCD · 4 继电器</text>
  <text x="680" y="396" fill="#94a3b8" font-size="12">CR2032 只养日志，不养位置</text>

  <rect x="360" y="440" width="580" height="55" rx="8" fill="#152033" stroke="#94a3b8"/>
  <text x="380" y="473" fill="#94a3b8" font-size="13">电机恒温器 NC 串线圈  ·  接触器主触点去端子 4 5 6  ·  PE 接壳体</text>
</svg>
<p class="note">Step 6 冻结此分舱。状态机（限位/力矩/解座/反转延时）在 Step 7 写，引脚表已够用。</p>
</div>
</body>
</html>
